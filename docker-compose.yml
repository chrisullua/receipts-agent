services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: facturas
      POSTGRES_USER: facturas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facturas}
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturas"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://facturas:${POSTGRES_PASSWORD:-facturas}@db:5432/facturas
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      - api

volumes:
  pgdata:
  n8ndata:
